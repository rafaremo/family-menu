# Solo para DESARROLLO: Postgres local (la app corre con `npm run dev`).
# En producción la app se despliega en Coolify desde el Dockerfile y la BD es un
# recurso PostgreSQL independiente de Coolify (ver docs/DEPLOY.md).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family}
      POSTGRES_DB: family_menu
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_menu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
