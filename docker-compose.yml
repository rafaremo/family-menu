# Desarrollo: solo Postgres (la app corre con `npm run dev`).
# Producción: `docker compose --profile prod up -d --build`
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family}
      POSTGRES_DB: family_menu
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_menu"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["prod"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://family:${POSTGRES_PASSWORD:-family}@db:5432/family_menu
      UPLOADS_DIR: /data/uploads
      PORT: 3000
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
